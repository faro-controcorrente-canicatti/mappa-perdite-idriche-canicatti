<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione segnalazioni - Canicattì</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#1565c0;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h2{
  margin:0 0 8px;
  font-size:28px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}

input,textarea,select{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  margin:6px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  width:100%;
  background:#1565c0;
  color:white;
  margin-top:8px;
}

.logout{
  background:#555;
  color:white;
  float:right;
}

.apri{
  background:#1565c0;
  color:white;
}

.salva{
  background:#198754;
  color:white;
}

.stampa{
  background:#444;
  color:white;
}

.rifiuta{
  background:#dc3545;
  color:white;
}

.chiudi{
  background:#e9ecef;
  color:#222;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:14px;
  background:#fff3cd;
  font-size:14px;
  margin-bottom:8px;
}

.hidden{
  display:none!important;
}

#messaggio{
  margin-top:10px;
  color:#b00020;
}

.segnalazione{
  cursor:pointer;
}

.segnalazione h3{
  margin:8px 0;
}

.meta{
  color:#666;
  font-size:14px;
}

.foto{
  width:100%;
  max-height:450px;
  object-fit:contain;
  background:#eee;
  border-radius:10px;
  margin:10px 0 18px;
}

.dettaglio{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:999;
  overflow:auto;
  padding:15px;
}

.dettaglio-box{
  max-width:750px;
  margin:20px auto;
  background:white;
  border-radius:16px;
  padding:20px;
}

.top-detail{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.top-detail h2{
  margin:0;
}

.empty{
  text-align:center;
  padding:30px;
}

.filtri{
  margin:15px 0;
}

@media(max-width:600px){
  header h2{font-size:24px}
  .container{padding:12px}
  .card{padding:16px}
  button{font-size:15px}
}

@media print{

  body *{
    visibility:hidden;
  }

  #dettaglio,
  #dettaglio *{
    visibility:visible;
  }

  #dettaglio{
    position:absolute;
    inset:0;
    background:white;
    padding:0;
  }

  .dettaglio-box{
    margin:0;
    max-width:none;
    box-shadow:none;
  }

  .actions,
  .chiudi{
    display:none!important;
  }
}
</style>
</head>

<body>

<header>
  <h2>📋 Gestione segnalazioni</h2>
  <div>Canicattì Partecipa</div>
</header>

<div class="container">

  <div id="loginBox" class="card">

    <h3>Accesso amministratore</h3>

    <input
      id="email"
      type="email"
      placeholder="E-mail"
      autocomplete="username">

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button class="login" onclick="login()">
      Accedi
    </button>

    <div id="messaggio"></div>

  </div>


  <div id="adminBox" class="hidden">

    <button class="logout" onclick="logout()">
      Esci
    </button>

    <h2>Pannello di controllo</h2>

    <div style="clear:both"></div>

    <div class="filtri">

      <select id="filtroStato" onchange="caricaSegnalazioni()">

        <option value="">
          Tutte le segnalazioni
        </option>

        <option value="in_attesa">
          In attesa
        </option>

        <option value="verificata">
          Verificate
        </option>

        <option value="inoltrata">
          Inoltrate
        </option>

        <option value="attesa_ente">
          In attesa dell'ente
        </option>

        <option value="risolta">
          Risolte
        </option>

        <option value="chiusa">
          Chiuse
        </option>

        <option value="rifiutata">
          Rifiutate
        </option>

      </select>

    </div>

    <div id="elenco">
      Caricamento...
    </div>

  </div>

</div>


<div id="dettaglio" class="dettaglio hidden">

  <div class="dettaglio-box">

    <div class="top-detail">

      <h2>Dettaglio segnalazione</h2>

      <button
        class="chiudi"
        onclick="chiudiDettaglio()">
        ✕
      </button>

    </div>

    <p id="numeroPratica" class="meta"></p>

    <div id="fotoBox"></div>

    <label><strong>Indirizzo</strong></label>
    <input id="dIndirizzo">

    <label><strong>Categoria</strong></label>

    <select id="dCategoria">

      <option value="strade">
        Buche, strade e marciapiedi
      </option>

      <option value="acqua">
        Perdite d'acqua e problemi idrici
      </option>

      <option value="rifiuti">
        Rifiuti e pulizia
      </option>

      <option value="illuminazione">
        Illuminazione pubblica
      </option>

      <option value="verde">
        Verde pubblico
      </option>

      <option value="segnaletica">
        Segnaletica e sicurezza stradale
      </option>

      <option value="degrado">
        Degrado urbano
      </option>

      <option value="altro">
        Altro
      </option>

    </select>

    <label><strong>Descrizione</strong></label>
    <textarea id="dDescrizione"></textarea>

    <label><strong>Nome e cognome</strong></label>
    <input id="dNome">

    <label><strong>Telefono</strong></label>
    <input id="dTelefono">

    <label><strong>Email</strong></label>
    <input id="dEmail">

    <label><strong>Stato della pratica</strong></label>

    <select id="dStato">

      <option value="in_attesa">
        In attesa di verifica
      </option>

      <option value="verificata">
        Documentazione verificata
      </option>

      <option value="inoltrata">
        Inoltrata all'ente
      </option>

      <option value="attesa_ente">
        In attesa dell'ente
      </option>

      <option value="risolta">
        Risolta
      </option>

      <option value="chiusa">
        Chiusa
      </option>

      <option value="rifiutata">
        Rifiutata
      </option>

    </select>

    <div class="actions">

      <button
        class="salva"
        onclick="salvaPratica()">
        💾 Salva modifiche
      </button>

      <button
        class="stampa"
        onclick="window.print()">
        🖨️ Stampa
      </button>

      <button
        class="rifiuta"
        onclick="rifiutaPratica()">
        ✕ Rifiuta
      </button>

    </div>

    <p id="messaggioDettaglio"></p>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://zkwwxxmbikxpzedcmjxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5usTyC1lIfP6ykIY456Glw_iJdy6NvP";

let token = null;
let praticaCorrente = null;


/* LOGIN */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const messaggio =
    document.getElementById("messaggio");

  if(!email || !password){

    messaggio.textContent =
      "Inserisci e-mail e password.";

    return;
  }

  messaggio.textContent =
    "Accesso in corso...";

  try{

    const r = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const d = await r.json();

    if(!r.ok || !d.access_token){

      messaggio.textContent =
        "Accesso non riuscito: " +
        (
          d.msg ||
          d.message ||
          d.error_description ||
          d.error ||
          "errore sconosciuto"
        );

      return;
    }

    token = d.access_token;

    messaggio.textContent = "";

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

    caricaSegnalazioni();

  }
  catch(error){

    messaggio.textContent =
      "Errore di connessione: " +
      error.message;
  }
}


/* CARICAMENTO */

async function caricaSegnalazioni(){

  const elenco =
    document.getElementById("elenco");

  const filtro =
    document.getElementById("filtroStato").value;

  elenco.innerHTML =
    "Caricamento...";

  let url =
    SUPABASE_URL +
    "/rest/v1/segnalazioni_cittadini" +
    "?select=*" +
    "&order=data_invio.desc";

  if(filtro){

    url +=
      "&stato=eq." +
      encodeURIComponent(filtro);
  }

  try{

    const r = await fetch(url,{
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + token
      }
    });

    if(!r.ok){

      elenco.innerHTML =
        "<div class='card'>Errore nel caricamento.</div>";

      return;
    }

    const dati = await r.json();

    if(!dati.length){

      elenco.innerHTML =
        "<div class='card empty'>" +
        "Nessuna segnalazione presente." +
        "</div>";

      return;
    }

    elenco.innerHTML = "";

    dati.forEach(s=>{

      const card =
        document.createElement("div");

      card.className =
        "card segnalazione";

      card.innerHTML = `

        <span class="badge">
          ${nomeStato(s.stato)}
        </span>

        <h3>
          ${esc(s.indirizzo || "Indirizzo non indicato")}
        </h3>

        <p>
          ${esc(s.descrizione || "")}
        </p>

        <p class="meta">
          Pratica #${Number(s.id)}
          ${
            s.data_invio
            ?
            " · " +
            new Date(s.data_invio)
              .toLocaleString("it-IT")
            :
            ""
          }
        </p>

        <button class="apri">
          Apri pratica
        </button>
      `;

      card
        .querySelector(".apri")
        .addEventListener(
          "click",
          ()=>apriPratica(s)
        );

      elenco.appendChild(card);

    });

  }
  catch(error){

    elenco.innerHTML =
      "<div class='card'>" +
      "Errore di connessione: " +
      esc(error.message) +
      "</div>";
  }
}


/* APRI PRATICA */

function apriPratica(s){

  praticaCorrente = s;

  document.getElementById("numeroPratica")
    .textContent =
    "Pratica #" + s.id +
    (
      s.data_invio
      ?
      " — ricevuta il " +
      new Date(s.data_invio)
        .toLocaleString("it-IT")
      :
      ""
    );

  document.getElementById("dIndirizzo").value =
    s.indirizzo || "";

  document.getElementById("dCategoria").value =
    s.categoria || "altro";

  document.getElementById("dDescrizione").value =
    s.descrizione || "";

  document.getElementById("dNome").value =
    s.nome || "";

  document.getElementById("dTelefono").value =
    s.telefono || "";

  document.getElementById("dEmail").value =
    s.email || "";

  document.getElementById("dStato").value =
    s.stato || "in_attesa";

  document.getElementById("messaggioDettaglio")
    .textContent = "";

  const fotoBox =
    document.getElementById("fotoBox");

  if(s.foto_url){

    fotoBox.innerHTML = `

      <label>
        <strong>Fotografia allegata</strong>
      </label>

      <img
        class="foto"
        src="${escAttr(s.foto_url)}"
        alt="Fotografia della segnalazione">

    `;

  }else{

    fotoBox.innerHTML =
      "<p class='meta'>Nessuna fotografia allegata.</p>";
  }

  document
    .getElementById("dettaglio")
    .classList.remove("hidden");
}


/* CHIUDI */

function chiudiDettaglio(){

  document
    .getElementById("dettaglio")
    .classList.add("hidden");

  praticaCorrente = null;
}


/* SALVA */

async function salvaPratica(){

  if(!praticaCorrente) return;

  const messaggio =
    document.getElementById("messaggioDettaglio");

  messaggio.textContent =
    "Salvataggio in corso...";

  const dati = {

    indirizzo:
      document.getElementById("dIndirizzo").value.trim(),

    categoria:
      document.getElementById("dCategoria").value,

    descrizione:
      document.getElementById("dDescrizione").value.trim(),

    nome:
      document.getElementById("dNome").value.trim(),

    telefono:
      document.getElementById("dTelefono").value.trim() || null,

    email:
      document.getElementById("dEmail").value.trim() || null,

    stato:
      document.getElementById("dStato").value
  };

  try{

    const r = await fetch(

      SUPABASE_URL +
      "/rest/v1/segnalazioni_cittadini" +
      "?id=eq." +
      Number(praticaCorrente.id),

      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + token,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify(dati)
      }
    );

    if(!r.ok){

      const errore = await r.text();

      messaggio.textContent =
        "Errore: " + errore;

      return;
    }

    messaggio.textContent =
      "✅ Modifiche salvate correttamente.";

    praticaCorrente =
      Object.assign(praticaCorrente,dati);

    caricaSegnalazioni();

  }
  catch(error){

    messaggio.textContent =
      "Errore di connessione: " +
      error.message;
  }
}


/* RIFIUTA */

async function rifiutaPratica(){

  if(!praticaCorrente) return;

  const conferma =
    confirm(
      "Vuoi contrassegnare questa segnalazione come rifiutata?"
    );

  if(!conferma) return;

  document.getElementById("dStato").value =
    "rifiutata";

  await salvaPratica();
}


/* LOGOUT */

function logout(){

  token = null;
  praticaCorrente = null;

  document
    .getElementById("dettaglio")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("password").value = "";

  document.getElementById("messaggio")
    .textContent = "";
}


/* NOMI DEGLI STATI */

function nomeStato(stato){

  const nomi = {
    in_attesa:"In attesa",
    verificata:"Documentazione verificata",
    inoltrata:"Inoltrata all'ente",
    attesa_ente:"In attesa dell'ente",
    risolta:"Risolta",
    chiusa:"Chiusa",
    rifiutata:"Rifiutata"
  };

  return esc(
    nomi[stato] ||
    stato ||
    "Stato non indicato"
  );
}


/* SICUREZZA */

function esc(v){

  return String(v)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escAttr(v){
  return esc(v);
}

</script>

</body>
</html>
