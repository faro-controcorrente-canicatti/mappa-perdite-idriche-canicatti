<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Canicattì Partecipa - Pannello di controllo
</title>


<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#1565c0;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0 0 6px 0;
  font-size:25px;
}

header p{
  margin:0;
  opacity:.95;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}

input{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  width:100%;
  background:#1565c0;
  color:white;
  margin-top:8px;
}

.logout{
  background:#555;
  color:white;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.topbar h2{
  margin:0;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#fff3cd;
  color:#664d03;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

.categoria{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e7f1ff;
  color:#084298;
  font-size:13px;
  font-weight:bold;
  margin-left:5px;
}

.indirizzo{
  margin:7px 0 12px 0;
  font-size:21px;
}

.descrizione{
  line-height:1.5;
  white-space:pre-wrap;
}

.riga{
  padding:8px 0;
  border-bottom:1px solid #eee;
  line-height:1.4;
}

.riga:last-child{
  border-bottom:0;
}

.label{
  font-weight:bold;
  color:#444;
}

.data{
  color:#666;
  font-size:14px;
}

.foto-box{
  margin:15px 0;
}

.foto-box img{
  width:100%;
  max-height:420px;
  object-fit:contain;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
}

.foto-attesa{
  padding:20px;
  background:#f5f5f5;
  border-radius:10px;
  text-align:center;
  color:#666;
}

.azioni{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.approva{
  background:#198754;
  color:white;
}

.rifiuta{
  background:#dc3545;
  color:white;
}

.apri{
  background:#1565c0;
  color:white;
}

.hidden{
  display:none !important;
}

#messaggio{
  margin-top:10px;
  color:#b00020;
}

#erroreAdmin{
  color:#b00020;
  margin-bottom:12px;
}


/* =========================
   MODALE DETTAGLIO
========================= */

.modale{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:1000;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:20px 10px;
  overflow-y:auto;
}

.modale-contenuto{
  width:100%;
  max-width:800px;
  background:white;
  border-radius:15px;
  padding:20px;
  margin:auto;
  position:relative;
}

.chiudi{
  position:absolute;
  top:10px;
  right:10px;
  background:#333;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
  padding:0;
  font-size:22px;
}

.modale-foto{
  width:100%;
  max-height:70vh;
  object-fit:contain;
  border-radius:10px;
  background:#eee;
  margin-top:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  header h1{
    font-size:22px;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:15px;
  }

  .topbar{
    align-items:flex-start;
  }

  .indirizzo{
    font-size:19px;
  }

  .azioni{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .azioni button{
    width:100%;
  }

  .apri{
    grid-column:1 / -1;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    🏛️ Canicattì Partecipa
  </h1>

  <p>
    Pannello di controllo delle segnalazioni
  </p>

</header>


<div class="container">


  <!-- LOGIN -->

  <div
    id="loginBox"
    class="card"
  >

    <h2>
      Accesso amministratore
    </h2>

    <input
      id="email"
      type="email"
      placeholder="E-mail"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login"
      onclick="login()"
    >
      Accedi
    </button>

    <div id="messaggio"></div>

  </div>



  <!-- PANNELLO -->

  <div
    id="adminBox"
    class="hidden"
  >

    <div class="topbar">

      <h2>
        Segnalazioni da verificare
      </h2>

      <button
        class="logout"
        onclick="logout()"
      >
        Esci
      </button>

    </div>

    <div id="erroreAdmin"></div>

    <div id="elenco">
      Caricamento...
    </div>

  </div>


</div>



<!-- MODALE DETTAGLIO -->

<div
  id="modale"
  class="modale hidden"
  onclick="chiudiDaSfondo(event)"
>

  <div class="modale-contenuto">

    <button
      class="chiudi"
      onclick="chiudiModale()"
      aria-label="Chiudi"
    >
      ×
    </button>

    <div id="dettaglio"></div>

  </div>

</div>



<script>


const SUPABASE_URL =
"https://zkwwxxmbikxpzedcmjxx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_5usTyC1lIfP6ykIY456Glw_iJdy6NvP";


const BUCKET_FOTO =
"segnalazioni-foto";


let token = null;

let segnalazioni = [];

let fotoCache = {};



/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const messaggio =
    document
      .getElementById("messaggio");


  if(!email || !password){

    messaggio.textContent =
      "Inserisci e-mail e password.";

    return;
  }


  messaggio.textContent =
    "Accesso in corso...";


  try{

    const r =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email:email,

              password:password

            })

        }

      );


    const d =
      await r.json();


    if(
      !r.ok ||
      !d.access_token
    ){

      messaggio.textContent =
        "ERRORE SUPABASE: " +
        (
          d.msg ||
          d.message ||
          d.error_description ||
          d.error ||
          "Errore sconosciuto"
        );

      return;
    }


    token =
      d.access_token;


    messaggio.textContent =
      "";


    document
      .getElementById("loginBox")
      .classList
      .add("hidden");


    document
      .getElementById("adminBox")
      .classList
      .remove("hidden");


    await caricaSegnalazioni();

  }

  catch(error){

    messaggio.textContent =
      "Errore di connessione: " +
      error.message;

  }

}



/* =========================
   CARICA SEGNALAZIONI
========================= */

async function caricaSegnalazioni(){

  const elenco =
    document
      .getElementById("elenco");

  const erroreAdmin =
    document
      .getElementById("erroreAdmin");


  elenco.innerHTML =
    "Caricamento...";

  erroreAdmin.textContent =
    "";


  try{

    const r =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/segnalazioni_cittadini" +
        "?select=*" +
        "&stato=neq.approvata" +
        "&order=data_invio.desc",

        {

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              token

          }

        }

      );


    if(!r.ok){

      const errore =
        await r.text();

      throw new Error(errore);

    }


    segnalazioni =
      await r.json();


    if(
      segnalazioni.length === 0
    ){

      elenco.innerHTML =
        "<div class='card'>" +
        "✅ Nessuna segnalazione da verificare." +
        "</div>";

      return;
    }


    elenco.innerHTML =
      "";


    segnalazioni.forEach(

      s => creaCard(s)

    );

  }

  catch(error){

    elenco.innerHTML =
      "";

    erroreAdmin.textContent =
      "Errore nel caricamento: " +
      error.message;

  }

}



/* =========================
   CREA CARD
========================= */

function creaCard(s){

  const elenco =
    document
      .getElementById("elenco");


  const card =
    document.createElement("div");


  card.className =
    "card";


  const data =
    formattaData(
      s.data_invio
    );


  card.innerHTML = `

    <div>

      <span class="badge">
        ${esc(
          nomeStato(
            s.stato
          )
        )}
      </span>

      ${
        s.categoria
        ?
        `<span class="categoria">
          ${esc(
            nomeCategoria(
              s.categoria
            )
          )}
        </span>`
        :
        ""
      }

    </div>


    <h3 class="indirizzo">

      📍
      ${esc(
        s.indirizzo ||
        "Indirizzo non indicato"
      )}

    </h3>


    ${
      data
      ?
      `<div class="data">
        📅 ${esc(data)}
      </div>`
      :
      ""
    }


    <p class="descrizione">

      ${esc(
        s.descrizione ||
        ""
      )}

    </p>


    ${
      s.foto_url
      ?
      `
      <div
        class="foto-box"
        id="foto-box-${Number(s.id)}"
      >

        <div class="foto-attesa">
          📷 Caricamento fotografia...
        </div>

      </div>
      `
      :
      ""
    }


    <div class="azioni">

      <button
        class="apri"
        onclick="apriSegnalazione(
          ${Number(s.id)}
        )"
      >
        🔎 Apri / Gestisci
      </button>


      <button
        class="approva"
        onclick="cambiaStato(
          ${Number(s.id)},
          'approvata'
        )"
      >
        ✓ Approva
      </button>


      <button
        class="rifiuta"
        onclick="cambiaStato(
          ${Number(s.id)},
          'rifiutata'
        )"
      >
        ✕ Rifiuta
      </button>

    </div>

  `;


  elenco.appendChild(card);


  if(s.foto_url){

    caricaFotoCard(
      s
    );

  }

}



/* =========================
   FOTO PRIVATA
========================= */

async function recuperaFoto(
  percorso
){

  if(!percorso){
    return null;
  }


  if(fotoCache[percorso]){

    return fotoCache[
      percorso
    ];

  }


  const r =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET_FOTO +
      "/" +
      encodePercorso(
        percorso
      ),

      {

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            token

        }

      }

    );


  if(!r.ok){

    const errore =
      await r.text();

    throw new Error(
      errore
    );

  }


  const blob =
    await r.blob();


  const url =
    URL.createObjectURL(
      blob
    );


  fotoCache[percorso] =
    url;


  return url;

}



/* =========================
   MOSTRA FOTO NELLA CARD
========================= */

async function caricaFotoCard(s){

  const box =
    document.getElementById(
      "foto-box-" +
      Number(s.id)
    );


  if(!box){
    return;
  }


  try{

    const url =
      await recuperaFoto(
        s.foto_url
      );


    box.innerHTML = `

      <img
        src="${url}"
        alt="Fotografia della segnalazione"
        onclick="apriFoto(
          ${Number(s.id)}
        )"
      >

    `;

  }

  catch(error){

    console.error(
      "Errore foto:",
      error
    );


    box.innerHTML = `

      <div class="foto-attesa">

        ⚠️ Fotografia presente,
        ma non visualizzabile.

      </div>

    `;

  }

}



/* =========================
   APRI SCHEDA
========================= */

async function apriSegnalazione(id){

  const s =
    segnalazioni.find(

      elemento =>
        Number(elemento.id) ===
        Number(id)

    );


  if(!s){
    return;
  }


  const dettaglio =
    document
      .getElementById("dettaglio");


  dettaglio.innerHTML = `

    <h2>
      Segnalazione #${Number(s.id)}
    </h2>


    <div>

      <span class="badge">

        ${esc(
          nomeStato(
            s.stato
          )
        )}

      </span>

      ${
        s.categoria
        ?
        `<span class="categoria">
          ${esc(
            nomeCategoria(
              s.categoria
            )
          )}
        </span>`
        :
        ""
      }

    </div>


    <h3 class="indirizzo">

      📍
      ${esc(
        s.indirizzo ||
        "Indirizzo non indicato"
      )}

    </h3>


    <div class="riga">

      <span class="label">
        Data:
      </span>

      ${esc(
        formattaData(
          s.data_invio
        ) ||
        "Non disponibile"
      )}

    </div>


    <div class="riga">

      <span class="label">
        Descrizione:
      </span>

      <div class="descrizione">

        ${esc(
          s.descrizione ||
          "Nessuna descrizione"
        )}

      </div>

    </div>


    <div class="riga">

      <span class="label">
        Nome:
      </span>

      ${esc(
        s.nome ||
        "Non indicato"
      )}

    </div>


    <div class="riga">

      <span class="label">
        Telefono:
      </span>

      ${esc(
        s.telefono ||
        "Non indicato"
      )}

    </div>


    <div class="riga">

      <span class="label">
        Email:
      </span>

      ${esc(
        s.email ||
        "Non indicata"
      )}

    </div>


    ${
      s.foto_url
      ?
      `
      <div class="riga">

        <span class="label">
          Fotografia:
        </span>

        <div
          id="foto-dettaglio-${Number(s.id)}"
          class="foto-box"
        >

          <div class="foto-attesa">
            📷 Caricamento fotografia...
          </div>

        </div>

      </div>
      `
      :
      `
      <div class="riga">

        <span class="label">
          Fotografia:
        </span>

        Nessuna fotografia allegata.

      </div>
      `
    }


    <div class="azioni">

      <button
        class="approva"
        onclick="
          cambiaStato(
            ${Number(s.id)},
            'approvata'
          );
          chiudiModale();
        "
      >
        ✓ Approva
      </button>


      <button
        class="rifiuta"
        onclick="
          cambiaStato(
            ${Number(s.id)},
            'rifiutata'
          );
          chiudiModale();
        "
      >
        ✕ Rifiuta
      </button>

    </div>

  `;


  document
    .getElementById("modale")
    .classList
    .remove("hidden");


  if(s.foto_url){

    try{

      const url =
        await recuperaFoto(
          s.foto_url
        );


      const box =
        document.getElementById(
          "foto-dettaglio-" +
          Number(s.id)
        );


      if(box){

        box.innerHTML = `

          <img
            class="modale-foto"
            src="${url}"
            alt="Fotografia della segnalazione"
          >

        `;

      }

    }

    catch(error){

      const box =
        document.getElementById(
          "foto-dettaglio-" +
          Number(s.id)
        );


      if(box){

        box.innerHTML = `

          <div class="foto-attesa">

            ⚠️ Non è stato possibile
            visualizzare la fotografia.

          </div>

        `;

      }

    }

  }

}



/* =========================
   APRI SOLO FOTO
========================= */

async function apriFoto(id){

  const s =
    segnalazioni.find(

      elemento =>
        Number(elemento.id) ===
        Number(id)

    );


  if(!s || !s.foto_url){
    return;
  }


  try{

    const url =
      await recuperaFoto(
        s.foto_url
      );


    document
      .getElementById("dettaglio")
      .innerHTML = `

        <h2>
          Fotografia
        </h2>

        <p>
          ${esc(
            s.indirizzo ||
            ""
          )}
        </p>

        <img
          class="modale-foto"
          src="${url}"
          alt="Fotografia della segnalazione"
        >

      `;


    document
      .getElementById("modale")
      .classList
      .remove("hidden");

  }

  catch(error){

    alert(
      "Non è stato possibile " +
      "aprire la fotografia."
    );

  }

}



/* =========================
   CHIUDI MODALE
========================= */

function chiudiModale(){

  document
    .getElementById("modale")
    .classList
    .add("hidden");

}


function chiudiDaSfondo(event){

  if(
    event.target.id ===
    "modale"
  ){

    chiudiModale();

  }

}



/* =========================
   CAMBIA STATO
========================= */

async function cambiaStato(
  id,
  stato
){

  try{

    const r =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/segnalazioni_cittadini" +
        "?id=eq." +
        Number(id),

        {

          method:"PATCH",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              stato:stato

            })

        }

      );


    if(!r.ok){

      const errore =
        await r.text();


      alert(
        "Non è stato possibile modificare " +
        "la segnalazione.\n\n" +
        errore
      );


      return;

    }


    await caricaSegnalazioni();

  }

  catch(error){

    alert(
      "Errore di connessione: " +
      error.message
    );

  }

}



/* =========================
   LOGOUT
========================= */

function logout(){

  token =
    null;


  Object.values(
    fotoCache
  ).forEach(

    url => {

      try{

        URL.revokeObjectURL(
          url
        );

      }

      catch(e){}

    }

  );


  fotoCache =
    {};


  segnalazioni =
    [];


  chiudiModale();


  document
    .getElementById("adminBox")
    .classList
    .add("hidden");


  document
    .getElementById("loginBox")
    .classList
    .remove("hidden");


  document
    .getElementById("password")
    .value =
    "";


  document
    .getElementById("messaggio")
    .textContent =
    "";

}



/* =========================
   UTILITÀ
========================= */

function nomeCategoria(v){

  const categorie = {

    strade:
      "Strade e marciapiedi",

    acqua:
      "Acqua",

    rifiuti:
      "Rifiuti e pulizia",

    illuminazione:
      "Illuminazione",

    verde:
      "Verde pubblico",

    segnaletica:
      "Segnaletica",

    degrado:
      "Degrado urbano",

    altro:
      "Altro"

  };


  return categorie[v] || v;

}



function nomeStato(v){

  const stati = {

    in_attesa:
      "In attesa",

    approvata:
      "Approvata",

    rifiutata:
      "Rifiutata"

  };


  return stati[v] || v || "In attesa";

}



function formattaData(v){

  if(!v){
    return "";
  }


  try{

    const data =
      new Date(v);


    return data.toLocaleString(
      "it-IT",
      {

        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"

      }
    );

  }

  catch(e){

    return v;

  }

}



function encodePercorso(percorso){

  return String(percorso)

    .split("/")

    .map(
      parte =>
        encodeURIComponent(
          parte
        )
    )

    .join("/");

}



function esc(v){

  return String(v ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>
