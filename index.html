<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mappa delle perdite idriche - Canicattì</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  height: 100%;
}

.box {
  position: absolute;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  max-width: 430px;
  background: white;
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}

.box h1 {
  font-size: 19px;
  margin: 0 0 5px;
}

.box p {
  font-size: 13px;
  color: #555;
  margin: 0;
}

.contatori {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 9px;
}

.contatore {
  padding: 6px 10px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 12px;
}

.contatore-attive {
  background: #fee2e2;
  color: #991b1b;
}

.contatore-riparate {
  background: #dcfce7;
  color: #166534;
}

.azioni {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.azione {
  flex: 1;
  border: 0;
  border-radius: 9px;
  padding: 9px 5px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.segnala-perdita {
  background: #dc2626;
  color: white;
}

.segnala-riparazione {
  background: #16a34a;
  color: white;
}

.stato-attiva {
  color: #b91c1c;
  font-weight: bold;
}

.stato-riparata {
  color: #15803d;
  font-weight: bold;
}

.scheda {
  min-width: 220px;
  font-size: 14px;
}

.scheda h3 {
  margin: 0 0 10px;
  font-size: 18px;
}

.indirizzo {
  font-size: 15px;
  font-weight: bold;
  text-decoration: underline;
}

.dettagli {
  margin-top: 12px;
  line-height: 1.6;
}

.foto {
  margin-top: 12px;
  padding: 15px;
  background: #f3f4f6;
  text-align: center;
  border-radius: 8px;
  color: #666;
}

.foto img {
  width: 100%;
  border-radius: 8px;
}

.modale {
  display: none;
  position: fixed;
  z-index: 3000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.55);
  overflow: auto;
}

.modale-contenuto {
  background: white;
  margin: 7vh auto;
  padding: 20px;
  width: calc(100% - 50px);
  max-width: 430px;
  border-radius: 15px;
  box-sizing: border-box;
}

.modale-contenuto h2 {
  margin-top: 0;
  font-size: 21px;
}

.modale-contenuto label {
  display: block;
  font-weight: bold;
  margin-top: 13px;
  margin-bottom: 5px;
}

.modale-contenuto input,
.modale-contenuto textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.modale-contenuto textarea {
  min-height: 90px;
  resize: vertical;
}

.avviso {
  margin-top: 12px;
  padding: 10px;
  background: #f3f4f6;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
}

.chiudi {
  float: right;
  font-size: 28px;
  cursor: pointer;
}

.invia {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

@media (max-width: 500px) {
  .box h1 {
    font-size: 18px;
  }

  .azione {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="box">

<h1>💧 Mappa delle perdite idriche – Canicattì</h1>

<p>
Tocca un punto sulla mappa per visualizzare la scheda della segnalazione.
</p>

<div class="contatori">

<div id="attive" class="contatore contatore-attive">
🔴 0 perdite attive
</div>

<div id="riparate" class="contatore contatore-riparate">
🟢 0 perdite riparate
</div>

</div>

<div class="azioni">

<button class="azione segnala-perdita"
onclick="apriModulo('perdita')">
💧 Segnala una perdita
</button>

<button class="azione segnala-riparazione"
onclick="apriModulo('riparazione')">
✅ Segnala riparazione
</button>

</div>

</div>

<div id="map"></div>


<!-- MODULO SEGNALAZIONE -->

<div id="modale" class="modale">

<div class="modale-contenuto">

<span class="chiudi" onclick="chiudiModulo()">&times;</span>

<h2 id="titoloModulo">Segnalazione</h2>

<form id="formSegnalazione">

<input type="hidden" id="tipoSegnalazione">

<label for="nome">Nome e cognome</label>
<input type="text" id="nome" required>

<label for="indirizzoSegnalazione">Indirizzo</label>
<input
type="text"
id="indirizzoSegnalazione"
placeholder="Es. Via Roma 10, Canicattì"
required>

<label for="descrizione">Descrizione</label>
<textarea
id="descrizione"
placeholder="Descrivi brevemente la situazione"
required></textarea>

<label for="fotoSegnalazione">Foto</label>
<input
type="file"
id="fotoSegnalazione"
accept="image/*">

<div class="avviso">
La segnalazione verrà sottoposta a verifica.
L'invio <b>non comporta la pubblicazione automatica sulla mappa</b>.
</div>

<button type="submit" class="invia">
Invia segnalazione
</button>

</form>

</div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([37.358, 13.850], 14);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}
).addTo(map);


/* SUPABASE */

const SUPABASE_URL =
"https://zkwwxxmbikxpzedcmjxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5usTyC1lIfP6ykIY456Glw_iJdy6NvP";

let perdite = [];


/* CARICAMENTO DATI */

async function caricaPerdite() {

  try {

    const risposta = await fetch(
      SUPABASE_URL +
      "/rest/v1/perdite?select=*&order=id.asc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!risposta.ok) {
      console.error(
        "Errore Supabase:",
        await risposta.text()
      );
      return;
    }

    const dati = await risposta.json();

    perdite = dati.map(p => ({
      id: p.id,
      indirizzo: p.indirizzo,
      latitudine: p.latitudine,
      longitudine: p.longitudine,
      data: p.data_segnalazione || "Da inserire",
      stato: (p.stato || "attiva").toLowerCase(),
      note: p.note || "Nessuna nota inserita",
      foto: p.foto_url || ""
    }));

    aggiornaContatori();
    await aggiungiPerdite();

  } catch (errore) {
    console.error("Errore caricamento dati:", errore);
  }
}


/* CONTATORI */

function aggiornaContatori() {

  const attive =
    perdite.filter(p => p.stato === "attiva").length;

  const riparate =
    perdite.filter(p => p.stato === "riparata").length;

  document.getElementById("attive").innerHTML =
    "🔴 " + attive +
    (attive === 1
      ? " perdita attiva"
      : " perdite attive");

  document.getElementById("riparate").innerHTML =
    "🟢 " + riparate +
    (riparate === 1
      ? " perdita riparata"
      : " perdite riparate");
}


/* AGGIUNTA PUNTI ALLA MAPPA */

async function aggiungiPerdite() {

  const punti = [];

  for (const perdita of perdite) {

    try {

      let lat;
      let lon;

      /*
      Se in Supabase esistono già coordinate,
      utilizziamo direttamente quelle.
      */

      if (
        perdita.latitudine != null &&
        perdita.longitudine != null
      ) {

        lat = parseFloat(perdita.latitudine);
        lon = parseFloat(perdita.longitudine);

      } else {

        /*
        Altrimenti cerchiamo l'indirizzo.
        */

        const ricerca = encodeURIComponent(
          perdita.indirizzo +
          ", Canicattì, Agrigento, Sicilia, Italia"
        );

        const risposta = await fetch(
          "https://nominatim.openstreetmap.org/search" +
          "?format=json&limit=1&countrycodes=it&q=" +
          ricerca
        );

        if (!risposta.ok) {
          console.log(
            "Geocodifica non riuscita:",
            perdita.indirizzo
          );
          continue;
        }

        const dati = await risposta.json();

        if (!dati.length) {
          console.log(
            "Indirizzo non trovato:",
            perdita.indirizzo
          );
          continue;
        }

        lat = parseFloat(dati[0].lat);
        lon = parseFloat(dati[0].lon);

        /*
        Piccola pausa per non sovraccaricare
        il servizio di ricerca indirizzi.
        */
        await new Promise(
          resolve => setTimeout(resolve, 1200)
        );
      }

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {
        continue;
      }

      punti.push([lat, lon]);

      const colore =
        perdita.stato === "riparata"
        ? "#16a34a"
        : "#d71920";

      const marker = L.circleMarker(
        [lat, lon],
        {
          radius: 9,
          color: "white",
          weight: 3,
          fillColor: colore,
          fillOpacity: 1
        }
      ).addTo(map);


      const statoHTML =
        perdita.stato === "riparata"
        ? "<span class='stato-riparata'>" +
          "🟢 PERDITA RIPARATA</span>"
        : "<span class='stato-attiva'>" +
          "🔴 PERDITA ATTIVA</span>";


      const fotoHTML =
        perdita.foto
        ? "<div class='foto'>" +
          "<img src='" +
          perdita.foto +
          "' alt='Foto della segnalazione'>" +
          "</div>"
        : "<div class='foto'>" +
          "📷 Foto da aggiungere</div>";


      marker.bindPopup(

        "<div class='scheda'>" +

        "<h3>💧 Perdita idrica</h3>" +

        "<div class='indirizzo'>" +
        perdita.indirizzo +
        ", Canicattì</div>" +

        "<div class='dettagli'>" +

        "<b>📅 Data segnalazione:</b> " +
        perdita.data +

        "<br>" +

        "<b>Stato:</b> " +
        statoHTML +

        "<br>" +

        "<b>📝 Note:</b> " +
        perdita.note +

        "</div>" +

        fotoHTML +

        "</div>"
      );

    } catch (errore) {

      console.log(
        "Errore con:",
        perdita.indirizzo,
        errore
      );
    }
  }


  /* INQUADRATURA AUTOMATICA */

  if (punti.length === 1) {

    map.setView(punti[0], 16);

  } else if (punti.length > 1) {

    map.fitBounds(
      punti,
      {
        padding: [40,40],
        maxZoom: 16
      }
    );
  }
}


/* MODULO */

function apriModulo(tipo) {

  document.getElementById("tipoSegnalazione").value =
    tipo;

  if (tipo === "riparazione") {

    document.getElementById("titoloModulo").innerText =
      "✅ Segnala una riparazione";

  } else {

    document.getElementById("titoloModulo").innerText =
      "💧 Segnala una nuova perdita";
  }

  document.getElementById("modale").style.display =
    "block";
}


function chiudiModulo() {

  document.getElementById("modale").style.display =
    "none";
}


/*
Per il momento il modulo NON modifica Supabase
e NON inserisce punti sulla mappa.

Nel prossimo passaggio collegheremo l'invio
a una raccolta separata delle segnalazioni.
*/

document
.getElementById("formSegnalazione")
.addEventListener("submit", function(event) {

  event.preventDefault();

  alert(
    "Modulo predisposto correttamente. " +
    "Nel prossimo passaggio collegheremo " +
    "l'invio delle segnalazioni."
  );

});


window.onclick = function(event) {

  const modale =
    document.getElementById("modale");

  if (event.target === modale) {
    chiudiModulo();
  }
};


/* AVVIO */

caricaPerdite();

</script>

</body>
</html>
