<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mappa delle perdite idriche - Canicattì</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  height: 100%;
}

.box {
  position: absolute;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  max-width: 430px;
  background: white;
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}

.box h1 {
  font-size: 19px;
  margin: 0 0 5px;
}

.box p {
  font-size: 13px;
  color: #555;
  margin: 0;
}

.contatori {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 9px;
}

.contatore {
  padding: 6px 10px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 12px;
}

.contatore-attive {
  background: #fee2e2;
  color: #991b1b;
}

.contatore-riparate {
  background: #dcfce7;
  color: #166534;
}

.stato-attiva {
  color: #b91c1c;
  font-weight: bold;
}

.stato-riparata {
  color: #15803d;
  font-weight: bold;
}

.scheda {
  min-width: 220px;
  font-size: 14px;
}

.scheda h3 {
  margin: 0 0 10px;
  font-size: 18px;
}

.indirizzo {
  font-size: 15px;
  font-weight: bold;
  text-decoration: underline;
}

.dettagli {
  margin-top: 12px;
  line-height: 1.6;
}

.foto {
  margin-top: 12px;
  padding: 15px;
  background: #f3f4f6;
  text-align: center;
  border-radius: 8px;
  color: #666;
}

</style>
</head>

<body>

<div class="box">

<h1>💧 Mappa delle perdite idriche – Canicattì</h1>

<p>
Tocca un punto sulla mappa per visualizzare la scheda della segnalazione.
</p>

<div class="contatori">

<div id="attive" class="contatore contatore-attive">
🔴 0 perdite attive
</div>

<div id="riparate" class="contatore contatore-riparate">
🟢 0 perdite riparate
</div>

</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([37.358, 13.850], 14);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}
).addTo(map);


/* ==========================================
   ELENCO DELLE SEGNALAZIONI

   Per modificare una perdita in futuro
   cambieremo solamente questi dati.
   ========================================== */

const perdite = [

{
  indirizzo: "Via Volturno 50",
  data: "Da inserire",
  stato: "attiva",
  note: "Nessuna nota inserita",
  foto: ""
},

{
  indirizzo: "Via Giuseppe Verdi 20",
  data: "Da inserire",
  stato: "attiva",
  note: "Nessuna nota inserita",
  foto: ""
},

{
  indirizzo: "Via Luigi Pirandello 67",
  data: "Da inserire",
  stato: "attiva",
  note: "Nessuna nota inserita",
  foto: ""
},

{
  indirizzo: "Via Duca degli Abruzzi 2",
  data: "Da inserire",
  stato: "attiva",
  note: "Nessuna nota inserita",
  foto: ""
},

{
  indirizzo: "Via Canova 3",
  data: "Da inserire",
  stato: "attiva",
  note: "Nessuna nota inserita",
  foto: ""
}

];


/* CONTATORI AUTOMATICI */

function aggiornaContatori() {

const attive =
perdite.filter(p => p.stato === "attiva").length;

const riparate =
perdite.filter(p => p.stato === "riparata").length;

document.getElementById("attive").innerHTML =
"🔴 " + attive +
(attive === 1 ? " perdita attiva" : " perdite attive");

document.getElementById("riparate").innerHTML =
"🟢 " + riparate +
(riparate === 1 ? " perdita riparata" : " perdite riparate");

}

aggiornaContatori();


/* CREAZIONE DELLA MAPPA */

async function aggiungiPerdite() {

let punti = [];

for (const perdita of perdite) {

try {

const ricerca =
encodeURIComponent(
perdita.indirizzo +
", 92024 Canicattì, Agrigento, Italia"
);

const risposta = await fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
ricerca
);

const dati = await risposta.json();

if (dati.length > 0) {

const lat = parseFloat(dati[0].lat);
const lon = parseFloat(dati[0].lon);

punti.push([lat, lon]);


/* COLORE AUTOMATICO DEL PUNTO */

const colore =
perdita.stato === "riparata"
? "#16a34a"
: "#d71920";


const marker = L.circleMarker(
[lat, lon],
{
  radius: 9,
  color: "white",
  weight: 3,
  fillColor: colore,
  fillOpacity: 1
}
).addTo(map);


/* STATO DELLA PERDITA */

const statoHTML =
perdita.stato === "riparata"

? "<span class='stato-riparata'>🟢 PERDITA RIPARATA</span>"

: "<span class='stato-attiva'>🔴 PERDITA ATTIVA</span>";


/* FOTO */

const fotoHTML =
perdita.foto

? "<div class='foto'><img src='" +
perdita.foto +
"' style='width:100%;border-radius:8px;'></div>"

: "<div class='foto'>📷 Foto da aggiungere</div>";


/* SCHEDA TECNICA */

marker.bindPopup(

"<div class='scheda'>" +

"<h3>💧 Perdita idrica</h3>" +

"<div class='indirizzo'>" +
perdita.indirizzo +
", Canicattì</div>" +

"<div class='dettagli'>" +

"<b>📅 Data segnalazione:</b> " +
perdita.data +

"<br>" +

"<b>Stato:</b> " +
statoHTML +

"<br>" +

"<b>📝 Note:</b> " +
perdita.note +

"</div>" +

fotoHTML +

"</div>"

);

}

} catch(e) {

console.log(
"Errore caricamento:",
perdita.indirizzo
);

}

await new Promise(
resolve => setTimeout(resolve, 1100)
);

}


/* INQUADRATURA AUTOMATICA */

if (punti.length > 0) {

map.fitBounds(
punti,
{
  padding: [40,40],
  maxZoom: 16
}
);

}

}

aggiungiPerdite();

</script>

</body>
</html>
