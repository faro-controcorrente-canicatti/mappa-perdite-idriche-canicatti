<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mappa delle perdite idriche - Canicattì</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  height: 100%;
}

.box {
  position: absolute;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  max-width: 620px;
  background: white;
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}

.box h1 {
  font-size: 19px;
  margin: 0 0 5px;
}

.box p {
  font-size: 13px;
  color: #555;
  margin: 0;
}

.contatori {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 9px;
}

.contatore {
  padding: 7px 12px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 12px;
}

.contatore-attive {
  background: #fee2e2;
  color: #991b1b;
}

.contatore-riparate {
  background: #dcfce7;
  color: #166534;
}

.azioni {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.azione {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 12px 5px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.segnala {
  background: #e52521;
}

.riparazione {
  background: #16a34a;
}

.stato-attiva {
  color: #b91c1c;
  font-weight: bold;
}

.stato-riparata {
  color: #15803d;
  font-weight: bold;
}

.scheda {
  min-width: 220px;
  font-size: 14px;
}

.scheda h3 {
  margin: 0 0 10px;
  font-size: 18px;
}

.indirizzo {
  font-size: 15px;
  font-weight: bold;
}

.dettagli {
  margin-top: 12px;
  line-height: 1.6;
}

.foto {
  margin-top: 12px;
  padding: 10px;
  background: #f3f4f6;
  text-align: center;
  border-radius: 8px;
  color: #666;
}

.foto img {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 8px;
}

#errore {
  display: none;
  margin-top: 8px;
  padding: 7px;
  background: #fff3cd;
  color: #664d03;
  border-radius: 7px;
  font-size: 11px;
}


/* ===========================
   MODULO SEGNALAZIONE
=========================== */

.overlay {
  display: none;
  position: fixed;
  z-index: 5000;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,.55);
  padding: 18px;
  overflow-y: auto;
}

.modulo {
  background: white;
  max-width: 480px;
  margin: 25px auto;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}

.modulo h2 {
  margin: 0 0 7px;
  font-size: 21px;
}

.modulo .spiegazione {
  font-size: 13px;
  color: #555;
  line-height: 1.4;
  margin-bottom: 18px;
}

.campo {
  margin-bottom: 14px;
}

.campo label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
}

.campo input,
.campo textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-family: Arial, sans-serif;
  font-size: 16px;
}

.campo textarea {
  min-height: 90px;
  resize: vertical;
}

.facoltativo {
  color: #777;
  font-weight: normal;
}

.pulsanti-modulo {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.btn-annulla,
.btn-invia {
  flex: 1;
  border: 0;
  padding: 12px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.btn-annulla {
  background: #e5e7eb;
  color: #333;
}

.btn-invia {
  background: #e52521;
  color: white;
}

.btn-invia:disabled {
  opacity: .6;
}

#messaggioModulo {
  display: none;
  margin-top: 14px;
  padding: 11px;
  border-radius: 9px;
  font-size: 13px;
  line-height: 1.4;
}

.successo {
  background: #dcfce7;
  color: #166534;
}

.erroreInvio {
  background: #fee2e2;
  color: #991b1b;
}

@media (max-width: 600px) {

  .box {
    max-width: none;
  }

  .azione {
    font-size: 12px;
  }

  .modulo {
    margin: 10px auto;
  }
}

</style>
</head>

<body>

<div class="box">

  <h1>💧 Mappa delle perdite idriche – Canicattì</h1>

  <p>
    Tocca un punto sulla mappa per visualizzare la scheda della segnalazione.
  </p>

  <div class="contatori">

    <div id="attive" class="contatore contatore-attive">
      🔴 0 perdite attive
    </div>

    <div id="riparate" class="contatore contatore-riparate">
      🟢 0 perdite riparate
    </div>

  </div>

  <div class="azioni">

    <button
      class="azione segnala"
      type="button"
      onclick="apriModuloPerdita()">
      💧 Segnala una perdita
    </button>

    <button
      class="azione riparazione"
      type="button"
      onclick="apriModuloRiparazione()">
      ✅ Segnala riparazione
    </button>

  </div>

  <div id="errore"></div>

</div>


<!-- MODULO -->

<div id="overlaySegnalazione" class="overlay">

  <div class="modulo">

    <h2 id="titoloModulo">
      💧 Segnala una perdita
    </h2>

    <div id="testoModulo" class="spiegazione">
      Invia la segnalazione. Dopo una verifica verrà eventualmente pubblicata sulla mappa.
    </div>

    <form id="formSegnalazione">

      <input
        type="hidden"
        id="tipoSegnalazione"
        value="perdita">

      <div class="campo">

        <label for="indirizzoSegnalazione">
          Indirizzo della perdita *
        </label>

        <input
          id="indirizzoSegnalazione"
          type="text"
          placeholder="Es. Via Roma 25"
          required>

      </div>

      <div class="campo">

        <label for="descrizioneSegnalazione">
          Descrizione *
        </label>

        <textarea
          id="descrizioneSegnalazione"
          placeholder="Descrivi brevemente la perdita o la riparazione"
          required></textarea>

      </div>

      <div class="campo">

        <label for="nomeSegnalazione">
          Nome
          <span class="facoltativo">(facoltativo)</span>
        </label>

        <input
          id="nomeSegnalazione"
          type="text"
          placeholder="Il tuo nome">

      </div>

      <div class="campo">

        <label for="contattoSegnalazione">
          Telefono o e-mail
          <span class="facoltativo">(facoltativo)</span>
        </label>

        <input
          id="contattoSegnalazione"
          type="text"
          placeholder="Per eventuali chiarimenti">

      </div>

      <div class="pulsanti-modulo">

        <button
          type="button"
          class="btn-annulla"
          onclick="chiudiModulo()">
          Annulla
        </button>

        <button
          id="btnInvia"
          type="submit"
          class="btn-invia">
          Invia segnalazione
        </button>

      </div>

      <div id="messaggioModulo"></div>

    </form>

  </div>

</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ===========================
   MAPPA
=========================== */

const map = L.map("map").setView(
  [37.358, 13.850],
  14
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* ===========================
   SUPABASE
=========================== */

const SUPABASE_URL =
"https://zkwwxxmbikxpzedcmjxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5usTyC1lIfP6ykIY456Glw_iJdy6NvP";

let perdite = [];


/* ===========================
   CARICAMENTO DATI
=========================== */

async function caricaPerdite() {

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/perdite?select=*&order=id.asc";

    const risposta = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Accept": "application/json"
      }
    });

    if (!risposta.ok) {

      const testo = await risposta.text();

      throw new Error(
        "Supabase " +
        risposta.status +
        ": " +
        testo
      );
    }

    const dati = await risposta.json();

    perdite = dati.map(function(p) {

      return {

        id: p.id,

        indirizzo:
          p.indirizzo ||
          p.ufficio ||
          "",

        data:
          p.data_segnalazione ||
          "Da inserire",

        stato:
          String(p.stato || "attiva")
          .trim()
          .toLowerCase(),

        note:
          p.note ||
          "Nessuna nota inserita",

        foto:
          p.foto_url ||
          ""

      };

    });

    aggiornaContatori();

    await aggiungiPerdite();

  }

  catch (errore) {

    console.error(errore);

    const boxErrore =
      document.getElementById("errore");

    boxErrore.style.display = "block";

    boxErrore.innerHTML =
      "⚠️ Impossibile caricare le segnalazioni dal database.";

  }

}


/* ===========================
   CONTATORI
=========================== */

function aggiornaContatori() {

  const attive =
    perdite.filter(function(p) {
      return p.stato === "attiva";
    }).length;

  const riparate =
    perdite.filter(function(p) {
      return p.stato === "riparata";
    }).length;

  document.getElementById("attive").innerHTML =
    "🔴 " +
    attive +
    (attive === 1
      ? " perdita attiva"
      : " perdite attive");

  document.getElementById("riparate").innerHTML =
    "🟢 " +
    riparate +
    (riparate === 1
      ? " perdita riparata"
      : " perdite riparate");

}


/* ===========================
   PUNTI MAPPA
=========================== */

async function aggiungiPerdite() {

  const punti = [];

  for (const perdita of perdite) {

    if (!perdita.indirizzo) {
      continue;
    }

    try {

      const ricerca =
        encodeURIComponent(
          perdita.indirizzo +
          ", Canicattì, AG, Italia"
        );

      const risposta =
        await fetch(
          "https://nominatim.openstreetmap.org/search" +
          "?format=json" +
          "&limit=1" +
          "&countrycodes=it" +
          "&q=" +
          ricerca
        );

      if (!risposta.ok) {
        continue;
      }

      const risultati =
        await risposta.json();

      if (risultati.length === 0) {
        continue;
      }

      const lat =
        parseFloat(risultati[0].lat);

      const lon =
        parseFloat(risultati[0].lon);

      punti.push([lat, lon]);

      const riparata =
        perdita.stato === "riparata";

      const colore =
        riparata
          ? "#16a34a"
          : "#d71920";

      const marker =
        L.circleMarker(
          [lat, lon],
          {
            radius: 9,
            color: "white",
            weight: 3,
            fillColor: colore,
            fillOpacity: 1
          }
        ).addTo(map);

      const statoHTML =
        riparata

        ? "<span class='stato-riparata'>" +
          "🟢 PERDITA RIPARATA" +
          "</span>"

        : "<span class='stato-attiva'>" +
          "🔴 PERDITA ATTIVA" +
          "</span>";

      let fotoHTML;

      if (perdita.foto) {

        fotoHTML =
          "<div class='foto'>" +
          "<img src='" +
          perdita.foto +
          "' alt='Foto perdita'>" +
          "</div>";

      } else {

        fotoHTML =
          "<div class='foto'>" +
          "📷 Foto da aggiungere" +
          "</div>";

      }

      marker.bindPopup(

        "<div class='scheda'>" +

          "<h3>💧 Perdita idrica</h3>" +

          "<div class='indirizzo'>" +
            perdita.indirizzo +
            ", Canicattì" +
          "</div>" +

          "<div class='dettagli'>" +

            "<b>📅 Data segnalazione:</b> " +
            perdita.data +

            "<br>" +

            "<b>Stato:</b> " +
            statoHTML +

            "<br>" +

            "<b>📝 Note:</b> " +
            perdita.note +

          "</div>" +

          fotoHTML +

        "</div>"

      );

    }

    catch (errore) {

      console.error(
        "Errore indirizzo:",
        perdita.indirizzo,
        errore
      );

    }

    await new Promise(function(resolve) {
      setTimeout(resolve, 1100);
    });

  }

  if (punti.length === 1) {

    map.setView(
      punti[0],
      16
    );

  }

  else if (punti.length > 1) {

    map.fitBounds(
      punti,
      {
        padding: [40, 40],
        maxZoom: 16
      }
    );

  }

}


/* ===========================
   APERTURA MODULI
=========================== */

function apriModuloPerdita() {

  document.getElementById("tipoSegnalazione").value =
    "perdita";

  document.getElementById("titoloModulo").innerHTML =
    "💧 Segnala una perdita";

  document.getElementById("testoModulo").innerHTML =
    "Indica dove si trova la perdita. " +
    "La segnalazione sarà verificata prima di essere pubblicata sulla mappa.";

  preparaModulo();

}


function apriModuloRiparazione() {

  document.getElementById("tipoSegnalazione").value =
    "riparazione";

  document.getElementById("titoloModulo").innerHTML =
    "✅ Segnala una riparazione";

  document.getElementById("testoModulo").innerHTML =
    "Se una perdita presente sulla mappa risulta riparata, segnalacelo. " +
    "La modifica sarà effettuata solo dopo la nostra verifica.";

  preparaModulo();

}


function preparaModulo() {

  document.getElementById("formSegnalazione").reset();

  document.getElementById("messaggioModulo").style.display =
    "none";

  document.getElementById("overlaySegnalazione").style.display =
    "block";

}


function chiudiModulo() {

  document.getElementById("overlaySegnalazione").style.display =
    "none";

}


/* ===========================
   INVIO A SUPABASE
=========================== */

document
.getElementById("formSegnalazione")
.addEventListener(
  "submit",
  async function(evento) {

    evento.preventDefault();

    const tipo =
      document.getElementById(
        "tipoSegnalazione"
      ).value;

    const indirizzo =
      document.getElementById(
        "indirizzoSegnalazione"
      ).value.trim();

    const descrizione =
      document.getElementById(
        "descrizioneSegnalazione"
      ).value.trim();

    const nome =
      document.getElementById(
        "nomeSegnalazione"
      ).value.trim();

    const contatto =
      document.getElementById(
        "contattoSegnalazione"
      ).value.trim();

    const bottone =
      document.getElementById("btnInvia");

    const messaggio =
      document.getElementById(
        "messaggioModulo"
      );

    bottone.disabled = true;

    bottone.innerHTML =
      "Invio in corso...";

    messaggio.style.display =
      "none";

    try {

      const risposta = await fetch(

        SUPABASE_URL +
        "/rest/v1/segnalazioni_cittadini",

        {
          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            tipo: tipo,

            indirizzo: indirizzo,

            descrizione: descrizione,

            nome:
              nome || null,

            contatto:
              contatto || null,

            stato:
              "in_attesa"

          })

        }

      );

      if (!risposta.ok) {

        const testo =
          await risposta.text();

        throw new Error(testo);

      }

      messaggio.className =
        "successo";

      messaggio.style.display =
        "block";

      messaggio.innerHTML =
        "✅ <b>Segnalazione inviata.</b><br>" +
        "Grazie per la collaborazione. " +
        "La segnalazione sarà verificata prima di essere pubblicata sulla mappa.";

      document
        .getElementById(
          "formSegnalazione"
        )
        .reset();

    }

    catch (errore) {

      console.error(errore);

      messaggio.className =
        "erroreInvio";

      messaggio.style.display =
        "block";

      messaggio.innerHTML =
        "⚠️ Non è stato possibile inviare la segnalazione. Riprova tra poco.";

    }

    finally {

      bottone.disabled =
        false;

      bottone.innerHTML =
        "Invia segnalazione";

    }

  }
);


/* ===========================
   AVVIO
=========================== */

caricaPerdite();

  /* ===== RECUPERO PASSWORD ===== */

async function gestisciRecuperoPassword() {

  const hash = window.location.hash;

  if (!hash || !hash.includes("type=recovery")) {
    return;
  }

  const params = new URLSearchParams(hash.substring(1));
  const accessToken = params.get("access_token");

  if (!accessToken) {
    alert("Link di recupero password non valido o scaduto.");
    return;
  }

  const nuovaPassword = prompt(
    "Inserisci la nuova password (almeno 6 caratteri):"
  );

  if (!nuovaPassword) return;

  if (nuovaPassword.length < 6) {
    alert("La password deve contenere almeno 6 caratteri.");
    return;
  }

  const confermaPassword = prompt(
    "Inserisci nuovamente la password:"
  );

  if (nuovaPassword !== confermaPassword) {
    alert("Le due password non coincidono.");
    return;
  }

  try {

    const risposta = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        method: "PUT",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          password: nuovaPassword
        })
      }
    );

    if (!risposta.ok) {
      const errore = await risposta.json();
      throw new Error(errore.message || "Errore");
    }

    alert("Password modificata correttamente!");

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (errore) {

    alert(
      "Non è stato possibile modificare la password: " +
      errore.message
    );

  }
}

gestisciRecuperoPassword();

</script>

</body>
</html>
