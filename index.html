<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mappa delle perdite idriche - Canicattì</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  height: 100%;
}

.box {
  position: absolute;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  max-width: 620px;
  background: white;
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}

.box h1 {
  font-size: 19px;
  margin: 0 0 5px;
}

.box p {
  font-size: 13px;
  color: #555;
  margin: 0;
}

.contatori {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 9px;
}

.contatore {
  padding: 7px 12px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 12px;
}

.contatore-attive {
  background: #fee2e2;
  color: #991b1b;
}

.contatore-riparate {
  background: #dcfce7;
  color: #166534;
}

.azioni {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.azione {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 12px 5px;
  color: white;
  font-size: 13px;
  font-weight: bold;
}

.segnala {
  background: #e52521;
}

.riparazione {
  background: #16a34a;
}

.stato-attiva {
  color: #b91c1c;
  font-weight: bold;
}

.stato-riparata {
  color: #15803d;
  font-weight: bold;
}

.scheda {
  min-width: 220px;
  font-size: 14px;
}

.scheda h3 {
  margin: 0 0 10px;
  font-size: 18px;
}

.indirizzo {
  font-size: 15px;
  font-weight: bold;
}

.dettagli {
  margin-top: 12px;
  line-height: 1.6;
}

.foto {
  margin-top: 12px;
  padding: 10px;
  background: #f3f4f6;
  text-align: center;
  border-radius: 8px;
  color: #666;
}

.foto img {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 8px;
}

#errore {
  display: none;
  margin-top: 8px;
  padding: 7px;
  background: #fff3cd;
  color: #664d03;
  border-radius: 7px;
  font-size: 11px;
}

@media (max-width: 600px) {
  .box {
    max-width: none;
  }

  .azione {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="box">

  <h1>💧 Mappa delle perdite idriche – Canicattì</h1>

  <p>
    Tocca un punto sulla mappa per visualizzare la scheda della segnalazione.
  </p>

  <div class="contatori">

    <div id="attive" class="contatore contatore-attive">
      🔴 0 perdite attive
    </div>

    <div id="riparate" class="contatore contatore-riparate">
      🟢 0 perdite riparate
    </div>

  </div>

  <div class="azioni">

    <button class="azione segnala" type="button">
      💧 Segnala una perdita
    </button>

    <button class="azione riparazione" type="button">
      ✅ Segnala riparazione
    </button>

  </div>

  <div id="errore"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ===========================
   MAPPA
=========================== */

const map = L.map("map").setView(
  [37.358, 13.850],
  14
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* ===========================
   SUPABASE
=========================== */

const SUPABASE_URL =
"https://zkwwxxmbikxpzedcmjxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5usTyC1lIfP6ykIY456Glw_iJdy6NvP";

let perdite = [];


/* ===========================
   CARICAMENTO DATI
=========================== */

async function caricaPerdite() {

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/perdite?select=*&order=id.asc";

    const risposta = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Accept": "application/json"
      }
    });

    if (!risposta.ok) {

      const testo = await risposta.text();

      throw new Error(
        "Supabase " +
        risposta.status +
        ": " +
        testo
      );
    }

    const dati = await risposta.json();

    console.log(
      "DATI RICEVUTI DA SUPABASE:",
      dati
    );

    perdite = dati.map(function(p) {

      return {

        id: p.id,

        indirizzo:
          p.indirizzo ||
          p.ufficio ||
          "",

        data:
          p.data_segnalazione ||
          "Da inserire",

        stato:
          String(p.stato || "attiva")
          .trim()
          .toLowerCase(),

        note:
          p.note ||
          "Nessuna nota inserita",

        foto:
          p.foto_url ||
          ""

      };

    });

    aggiornaContatori();

    await aggiungiPerdite();

  }

  catch (errore) {

    console.error(errore);

    const boxErrore =
      document.getElementById("errore");

    boxErrore.style.display = "block";

    boxErrore.innerHTML =
      "⚠️ Impossibile caricare le segnalazioni dal database.";

  }

}


/* ===========================
   CONTATORI
=========================== */

function aggiornaContatori() {

  const attive =
    perdite.filter(function(p) {
      return p.stato === "attiva";
    }).length;

  const riparate =
    perdite.filter(function(p) {
      return p.stato === "riparata";
    }).length;

  document.getElementById("attive").innerHTML =
    "🔴 " +
    attive +
    (attive === 1
      ? " perdita attiva"
      : " perdite attive");

  document.getElementById("riparate").innerHTML =
    "🟢 " +
    riparate +
    (riparate === 1
      ? " perdita riparata"
      : " perdite riparate");

}


/* ===========================
   INSERIMENTO PUNTI
=========================== */

async function aggiungiPerdite() {

  const punti = [];

  for (const perdita of perdite) {

    if (!perdita.indirizzo) {
      continue;
    }

    try {

      const ricerca =
        encodeURIComponent(
          perdita.indirizzo +
          ", Canicattì, AG, Italia"
        );

      const risposta =
        await fetch(
          "https://nominatim.openstreetmap.org/search" +
          "?format=json" +
          "&limit=1" +
          "&countrycodes=it" +
          "&q=" +
          ricerca
        );

      if (!risposta.ok) {
        continue;
      }

      const risultati =
        await risposta.json();

      if (risultati.length === 0) {

        console.log(
          "Indirizzo non trovato:",
          perdita.indirizzo
        );

        continue;
      }

      const lat =
        parseFloat(risultati[0].lat);

      const lon =
        parseFloat(risultati[0].lon);

      punti.push([lat, lon]);


      /* COLORE */

      const riparata =
        perdita.stato === "riparata";

      const colore =
        riparata
          ? "#16a34a"
          : "#d71920";


      /* PUNTO */

      const marker =
        L.circleMarker(
          [lat, lon],
          {
            radius: 9,
            color: "white",
            weight: 3,
            fillColor: colore,
            fillOpacity: 1
          }
        ).addTo(map);


      /* STATO */

      const statoHTML =
        riparata

        ? "<span class='stato-riparata'>" +
          "🟢 PERDITA RIPARATA" +
          "</span>"

        : "<span class='stato-attiva'>" +
          "🔴 PERDITA ATTIVA" +
          "</span>";


      /* FOTO */

      let fotoHTML;

      if (perdita.foto) {

        fotoHTML =
          "<div class='foto'>" +
          "<img src='" +
          perdita.foto +
          "' alt='Foto perdita'>" +
          "</div>";

      } else {

        fotoHTML =
          "<div class='foto'>" +
          "📷 Foto da aggiungere" +
          "</div>";

      }


      /* POPUP */

      marker.bindPopup(

        "<div class='scheda'>" +

          "<h3>💧 Perdita idrica</h3>" +

          "<div class='indirizzo'>" +
            perdita.indirizzo +
            ", Canicattì" +
          "</div>" +

          "<div class='dettagli'>" +

            "<b>📅 Data segnalazione:</b> " +
            perdita.data +

            "<br>" +

            "<b>Stato:</b> " +
            statoHTML +

            "<br>" +

            "<b>📝 Note:</b> " +
            perdita.note +

          "</div>" +

          fotoHTML +

        "</div>"

      );

    }

    catch (errore) {

      console.error(
        "Errore indirizzo:",
        perdita.indirizzo,
        errore
      );

    }


    /* Piccola pausa per Nominatim */

    await new Promise(function(resolve) {
      setTimeout(resolve, 1100);
    });

  }


  /* ===========================
     INQUADRATURA AUTOMATICA
  =========================== */

  if (punti.length === 1) {

    map.setView(
      punti[0],
      16
    );

  }

  else if (punti.length > 1) {

    map.fitBounds(
      punti,
      {
        padding: [40, 40],
        maxZoom: 16
      }
    );

  }

}


/* ===========================
   AVVIO
=========================== */

caricaPerdite();

</script>

</body>
</html>
